<!doctype html>
<html lang="zh-Hans">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>华语一知识群岛</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Ma+Shan+Zheng&family=Noto+Sans+SC:wght@400;500;700&display=swap">
<style>
/* Nanyang theme: shophouses, Kampong Ayer stilt houses, batik, Peranakan tiles.
   Layout: full-bleed 3D archipelago; floating glass top bar; right drawer (desktop) / bottom sheet (phone) for island study + challenge.
   Palette: UBD LC Chinese Red + Imperial Gold over a tropical Brunei sea. */
:root{
  --panel:#fffaf2; --panel-2:#f5ecdd; --ink:#2b1d16; --muted:#6e5d52; --line:rgba(90,55,30,.16);
  --red:#b3121c; --red-ink:#fffaf2; --gold:#a87a12; --gold-soft:#f4e4b8;
  --ok:#2c7a4b; --ok-soft:#dcefe2; --bad:#b3121c; --bad-soft:#f8dcdc;
  --glass:rgba(255,250,242,.88); --shadow:0 12px 32px rgba(50,25,10,.18);
  --tile-a:#2f7d6b; --tile-b:#f2b8b5; --tile-wash:rgba(47,125,107,.12);
  --sky:#bfe2ec; --fog:#cfe8ef; --sea:#1f7d98;
  --f-display:"Ma Shan Zheng","STKaiti","KaiTi",serif;
  --f-body:"Noto Sans SC","PingFang SC","Microsoft YaHei",system-ui,sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --panel:#1d1715; --panel-2:#2a211d; --ink:#f6ece2; --muted:#bfae9f; --line:rgba(255,225,190,.14);
  --red:#e2474f; --red-ink:#1d1715; --gold:#e6b84c; --gold-soft:#4a3a1a;
  --ok:#62c98f; --ok-soft:#1f3a2b; --bad:#ff7070; --bad-soft:#4a2224;
  --glass:rgba(29,23,21,.88); --shadow:0 12px 32px rgba(0,0,0,.45); --tile-a:#4fb39a; --tile-b:#7a3f45; --tile-wash:rgba(79,179,154,.14);
  --sky:#142638; --fog:#16283a; --sea:#1b5574; color-scheme:dark;}}
:root[data-theme="dark"]{
  --panel:#1d1715; --panel-2:#2a211d; --ink:#f6ece2; --muted:#bfae9f; --line:rgba(255,225,190,.14);
  --red:#e2474f; --red-ink:#1d1715; --gold:#e6b84c; --gold-soft:#4a3a1a;
  --ok:#62c98f; --ok-soft:#1f3a2b; --bad:#ff7070; --bad-soft:#4a2224;
  --glass:rgba(29,23,21,.88); --shadow:0 12px 32px rgba(0,0,0,.45); --tile-a:#4fb39a; --tile-b:#7a3f45; --tile-wash:rgba(79,179,154,.14);
  --sky:#142638; --fog:#16283a; --sea:#1b5574; color-scheme:dark;}
[hidden]{display:none!important}
html,body{height:100%}
body{margin:0;background:var(--sky);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.55;overflow:hidden}
button{font:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
#app{position:relative;height:100%;overflow:hidden}
#scene{position:absolute;inset:0;width:100%;height:100%;display:block;touch-action:none}
#labels{position:absolute;inset:0;pointer-events:none}

/* island labels */
.lbl{position:absolute;left:0;top:0;pointer-events:auto;display:flex;align-items:center;gap:6px;padding:5px 10px 5px 5px;border-radius:999px;border:1px solid var(--line);background:var(--glass);box-shadow:var(--shadow);white-space:nowrap;transform:translate(-50%,-100%);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px)}
.lbl:hover{border-color:var(--gold)}
.lbl-no{font-size:11px;font-weight:700;letter-spacing:.04em;background:var(--red);color:var(--red-ink);border-radius:999px;padding:2px 7px}
.lbl-name{font-family:var(--f-display);font-size:19px;line-height:1}
.lbl-stars{display:flex;gap:1px}
.lbl.locked{opacity:.82}
.lbl.locked .lbl-no{background:var(--muted)}
.lbl .now{font-size:11px;font-weight:700;color:var(--gold);border:1px solid var(--gold);border-radius:999px;padding:0 6px}
.star{width:13px;height:13px;display:block}
.star.on{fill:var(--gold)} .star.off{fill:none;stroke:var(--muted);stroke-width:1.6}
.lock{width:13px;height:13px;fill:var(--muted)}

/* top bar */
.topbar{position:absolute;top:12px;left:16px;right:16px;display:flex;gap:10px;align-items:flex-start;justify-content:space-between;pointer-events:none;flex-wrap:wrap}
.brand,.tools{pointer-events:auto;background:var(--glass);border:1px solid var(--line);box-shadow:var(--shadow);border-radius:16px;backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px)}
.brand{padding:10px 16px;display:flex;align-items:center;gap:14px;min-width:0}
.seal{width:44px;height:44px;flex:none;border-radius:10px;background:var(--red);color:var(--red-ink);display:grid;place-items:center;font-family:var(--f-display);font-size:26px;line-height:1;transform:rotate(-4deg)}
.brand h1{margin:0;font-family:var(--f-display);font-weight:400;font-size:26px;line-height:1.05;letter-spacing:.04em}
.brand p{margin:2px 0 0;font-size:12px;color:var(--muted);letter-spacing:.02em}
.prog{display:flex;align-items:center;gap:6px;padding-left:14px;border-left:1px solid var(--line);font-variant-numeric:tabular-nums;font-weight:700}
.prog small{display:block;font-weight:400;color:var(--muted);font-size:11px}
.tools{display:flex;padding:5px;gap:2px;flex-wrap:wrap}
.tbtn{display:flex;align-items:center;gap:6px;border:0;background:transparent;border-radius:11px;padding:8px 11px;font-size:13px;font-weight:500}
.tbtn:hover{background:var(--panel-2)}
.tbtn svg{width:17px;height:17px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.tbtn[aria-pressed="true"]{background:var(--gold-soft)}

.hint{position:absolute;left:16px;bottom:calc(14px + env(safe-area-inset-bottom,0px));font-size:12px;color:var(--ink);background:var(--glass);border:1px solid var(--line);border-radius:999px;padding:6px 14px;max-width:calc(100% - 32px);pointer-events:none}

/* drawers */
.drawer{position:absolute;top:12px;right:16px;bottom:12px;width:min(440px,calc(100% - 32px));background:var(--panel);border:1px solid var(--line);border-radius:20px;box-shadow:var(--shadow);display:flex;flex-direction:column;overflow:hidden;z-index:5}
.d-head{padding:18px 20px 12px;border-bottom:1px solid var(--line);position:relative;background:linear-gradient(var(--panel-2),var(--panel))}
.d-head::before{content:"";position:absolute;left:0;right:0;top:0;height:7px;background:
  radial-gradient(circle at 50% 50%,var(--gold) 0 2px,transparent 2.5px) 0 0/14px 7px,
  conic-gradient(from 45deg,var(--tile-a) 25%,var(--tile-b) 0 50%,var(--tile-a) 0 75%,var(--tile-b) 0) 0 0/14px 7px}
.brand{background-image:radial-gradient(circle at 0 0,var(--tile-wash),transparent 60%)}
.d-close{position:absolute;top:12px;right:12px;width:36px;height:36px;border-radius:50%;border:1px solid var(--line);background:var(--panel);display:grid;place-items:center}
.d-close svg{width:16px;height:16px;stroke:currentColor;stroke-width:2;fill:none}
.chip{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:700;letter-spacing:.04em;color:var(--red);text-transform:uppercase}
.chip b{background:var(--red);color:var(--red-ink);padding:1px 7px;border-radius:6px}
.d-title{margin:6px 0 0;font-family:var(--f-display);font-weight:400;font-size:40px;line-height:1.05;letter-spacing:.04em;padding-right:40px}
.d-sub{margin:2px 0 0;color:var(--muted);font-size:13px}
.meta{display:grid;grid-template-columns:auto 1fr;gap:2px 10px;margin:10px 0 0;font-size:12.5px}
.meta dt{color:var(--muted)} .meta dd{margin:0}
.tabs{display:flex;gap:6px;margin-top:14px}
.tab{flex:1;border:1px solid var(--line);background:var(--panel);border-radius:12px;padding:9px 10px;font-weight:700;font-size:14px;display:flex;justify-content:center;align-items:center;gap:8px}
.tab[aria-selected="true"]{background:var(--red);color:var(--red-ink);border-color:var(--red)}
.tab[aria-selected="true"] .star.on{fill:var(--red-ink)} .tab[aria-selected="true"] .star.off{stroke:var(--red-ink)}
.d-body{flex:1;overflow-y:auto;padding:16px 20px 28px;display:flex;flex-direction:column;gap:18px;overscroll-behavior:contain}

/* explore */
.spot{display:flex;flex-direction:column;gap:10px}
.spot-h{margin:0;display:flex;align-items:baseline;gap:10px;flex-wrap:wrap;font-size:17px}
.spot-h .tag{font-size:11px;font-weight:700;color:var(--gold);letter-spacing:.06em;border:1px solid var(--gold);border-radius:6px;padding:0 6px}
.spot-h .en{font-size:13px;color:var(--muted);font-weight:400}
.vocab{display:grid;grid-template-columns:repeat(auto-fill,minmax(122px,1fr));gap:6px}
.v{display:flex;flex-direction:column;align-items:flex-start;text-align:left;gap:0;padding:8px 10px;border:1px solid var(--line);background:var(--panel);border-radius:12px;min-width:0;position:relative}
.v:hover,.pat:hover{border-color:var(--gold);background:var(--panel-2)}
.v .hz{font-size:21px;font-weight:500;line-height:1.25}
.v .py{font-size:13px;color:var(--red);font-weight:500}
.v .en{font-size:12px;color:var(--muted);line-height:1.3}
.spk{position:absolute;top:8px;right:8px;width:14px;height:14px;fill:none;stroke:var(--muted);stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.pats{display:flex;flex-direction:column;gap:6px}
.pat{display:flex;flex-direction:column;align-items:flex-start;text-align:left;padding:10px 34px 10px 12px;border:1px solid var(--line);border-left:3px solid var(--red);background:var(--panel);border-radius:10px;position:relative}
.pat .zh{font-size:17px;font-weight:500}
.pat .py{font-size:13px;color:var(--red)}
.pat .en{font-size:12.5px;color:var(--muted)}
.tips{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:6px}
.tips li{font-size:13.5px;padding:8px 12px;border-radius:10px;background:var(--panel-2)}
.tips li.err{background:var(--bad-soft)}
.tips .wrong{text-decoration:line-through;color:var(--bad);font-weight:500}
.tips .right{color:var(--ok);font-weight:700}
.tips .why{display:block;color:var(--muted);font-size:12.5px}

/* quiz */
.q-top{display:flex;justify-content:space-between;align-items:center;font-size:13px;color:var(--muted);font-variant-numeric:tabular-nums}
.dots{display:flex;gap:5px}
.dots i{width:9px;height:9px;border-radius:50%;background:var(--line);display:block}
.dots i.ok{background:var(--ok)} .dots i.no{background:var(--bad)} .dots i.cur{background:var(--gold)}
.q-text{font-size:20px;font-weight:500;line-height:1.45;margin:0;text-wrap:balance}
.play{align-self:flex-start;display:flex;align-items:center;gap:8px;border:0;border-radius:999px;background:var(--red);color:var(--red-ink);padding:10px 18px;font-weight:700}
.play svg{width:18px;height:18px;fill:currentColor}
.apy{font-size:13px;color:var(--muted)}
.opts{display:flex;flex-direction:column;gap:8px}
.opt{text-align:left;padding:12px 14px;border-radius:12px;border:1.5px solid var(--line);background:var(--panel);font-size:16px;display:flex;gap:10px;align-items:center}
.opt:hover:not(:disabled){border-color:var(--gold)}
.opt .k{flex:none;width:24px;height:24px;border-radius:7px;background:var(--panel-2);display:grid;place-items:center;font-size:12px;font-weight:700;color:var(--muted)}
.opt.ok{border-color:var(--ok);background:var(--ok-soft)} .opt.ok .k{background:var(--ok);color:var(--panel)}
.opt.no{border-color:var(--bad);background:var(--bad-soft)} .opt.no .k{background:var(--bad);color:var(--panel)}
.opt:disabled{cursor:default}
.explain{font-size:14px;padding:10px 12px;border-radius:10px;background:var(--panel-2)}
.btn{border:0;border-radius:12px;padding:12px 18px;font-weight:700;font-size:15px;background:var(--red);color:var(--red-ink)}
.btn.ghost{background:transparent;border:1.5px solid var(--line);color:var(--ink)}
.row{display:flex;gap:8px;flex-wrap:wrap}
.start{display:flex;flex-direction:column;gap:14px;align-items:flex-start}
.start h3{margin:0;font-size:18px}
.start ul{margin:0;padding-left:18px;color:var(--muted);font-size:14px}
.result{display:flex;flex-direction:column;align-items:center;text-align:center;gap:10px;padding-top:8px}
.result .big{font-family:var(--f-display);font-size:54px;line-height:1}
.result .stars{display:flex;gap:6px}
.result .stars .star{width:40px;height:40px}
.result .stars .star.on{animation:pop .5s cubic-bezier(.3,1.6,.5,1) both}
.result .stars .star:nth-child(2){animation-delay:.12s}.result .stars .star:nth-child(3){animation-delay:.24s}
@keyframes pop{from{transform:scale(0)}to{transform:scale(1)}}
.unlock{font-weight:700;color:var(--ok)}

/* list */
.list{display:flex;flex-direction:column;gap:8px}
.li{display:grid;grid-template-columns:auto 1fr auto;align-items:center;gap:12px;text-align:left;border:1px solid var(--line);background:var(--panel);border-radius:14px;padding:10px 12px}
.li:hover{border-color:var(--gold)}
.li .n{font-size:12px;font-weight:700;background:var(--red);color:var(--red-ink);border-radius:8px;padding:3px 7px}
.li.locked .n{background:var(--muted)}
.li .nm{font-family:var(--f-display);font-size:22px;line-height:1.1}
.li .ds{display:block;font-size:12px;color:var(--muted)}
.li .rt{display:flex;flex-direction:column;align-items:flex-end;gap:3px;font-size:11px;color:var(--muted)}
.notice{font-size:13.5px;background:var(--gold-soft);border-radius:12px;padding:10px 12px}
.set{display:flex;flex-direction:column;gap:12px}
.switch{display:flex;justify-content:space-between;align-items:center;gap:12px;border:1px solid var(--line);border-radius:14px;padding:12px 14px;text-align:left;background:var(--panel)}
.switch .tr{flex:none;width:44px;height:26px;border-radius:999px;background:var(--line);position:relative;transition:background .2s}
.switch .tr::after{content:"";position:absolute;top:3px;left:3px;width:20px;height:20px;border-radius:50%;background:var(--panel);box-shadow:0 1px 3px rgba(0,0,0,.3);transition:left .2s}
.switch[aria-checked="true"] .tr{background:var(--ok)} .switch[aria-checked="true"] .tr::after{left:21px}
.switch small{display:block;color:var(--muted);font-size:12.5px}

#toast{position:absolute;left:50%;top:84px;transform:translateX(-50%);background:var(--ink);color:var(--panel);padding:10px 18px;border-radius:999px;font-size:14px;z-index:20;max-width:calc(100% - 32px);text-align:center;box-shadow:var(--shadow)}

@media (max-width:720px){
  .brand{padding:8px 12px;gap:10px}
  .seal{width:36px;height:36px;font-size:21px}
  .brand h1{font-size:21px}
  .brand p{display:none}
  .prog{padding-left:10px}
  .tbtn span{display:none}
  .tbtn{padding:9px}
  .drawer{top:auto;left:0;right:0;bottom:0;width:100%;height:min(66%,640px);border-radius:22px 22px 0 0;border-bottom:0}
  .d-body{padding-bottom:calc(28px + env(safe-area-inset-bottom,0px))}
  .d-title{font-size:34px}
  .hint{display:none}
  .lbl-name{font-size:16px}
  .lbl .now,.lbl-stars{display:none}
}
@media (prefers-reduced-motion:reduce){.result .stars .star.on{animation:none}}
</style>
</head>
<body>
<div id="app">
  <canvas id="scene" aria-label="三维知识群岛地图：九个岛屿，对应华语一的九个 Module"></canvas>
  <div id="labels"></div>

  <header class="topbar">
    <div class="brand">
      <div class="seal" aria-hidden="true">华</div>
      <div style="min-width:0">
        <h1>华语一知识群岛</h1>
        <p>LEM-1401 / LM-1403 Mandarin 1 · AY 2026/27 Semester 1 · 郑国俊老师</p>
      </div>
      <div class="prog" title="已获得的星星">
        <svg class="star on" viewBox="0 0 24 24" style="width:20px;height:20px"><path d="M12 2.5l2.9 6.1 6.6.8-4.9 4.6 1.3 6.6L12 17.3l-5.9 3.3 1.3-6.6L2.5 9.4l6.6-.8z"/></svg>
        <div><span id="starCount">0</span>/27<small id="weekNow"></small></div>
      </div>
    </div>
    <nav class="tools" aria-label="工具">
      <button class="tbtn" id="bList" type="button"><svg viewBox="0 0 24 24"><path d="M8 6h13M8 12h13M8 18h13M3 6h.01M3 12h.01M3 18h.01"/></svg><span>地点清单</span></button>
      <button class="tbtn" id="bHome" type="button"><svg viewBox="0 0 24 24"><path d="M3 11l9-7 9 7v9a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z"/></svg><span>回到全景</span></button>
      <button class="tbtn" id="bMotion" type="button" aria-pressed="false"><svg viewBox="0 0 24 24"><path d="M10 5v14M14 5v14"/></svg><span>暂停动态</span></button>
      <button class="tbtn" id="bSet" type="button"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></svg><span>设置</span></button>
    </nav>
  </header>

  <div class="hint" id="hint">拖曳旋转 · 右键或双指平移 · 滚轮或双指缩放 · 点岛屿登岛学习</div>

  <aside class="drawer" id="panel" hidden aria-label="岛屿学习面板"></aside>
  <aside class="drawer" id="side" hidden aria-label="清单与设置"></aside>
  <div id="toast" hidden role="status"></div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
<script>
"use strict";
/* ============================================================
   CONTENT — 9 islands = 9 Modules of the LEM-1401 / LM-1403 syllabus
   v: [汉字, pinyin, English]   p: [中文, pinyin, English]
   tips: {r:"rule"} or {w:"wrong", ok:"right", why:"reason"}
   quiz: {q, a, d:[distractors], x:explanation, au:text-to-speak, apy:pinyin}
   ============================================================ */
const ISLANDS = [
{ no:"M1", name:"拼音灯塔", py:"Pīnyīn Dēngtǎ", en:"Pinyin Lighthouse", module:"语音基石与汉字基础", moduleEn:"Pinyin, Tones & Script Mechanics",
  weeks:[1,2], lesson:"Unit 1 Lesson 1《汉语拼音与基本笔画》", assess:"拼音发音与辨调小测",
  pos:[-60,30], grass:0x86c25e, lm:"lighthouse",
  spots:[
   { h:"四个声调", en:"The four tones + neutral tone",
     v:[["妈","mā","mum · 1st tone, high & level"],["麻","má","hemp · 2nd tone, rising"],["马","mǎ","horse · 3rd tone, dipping"],["骂","mà","to scold · 4th tone, falling"],["吗","ma","question particle · neutral tone"]],
     tips:[{r:"标调顺序：有 a 标 a；没有 a，找 o 或 e；i 和 u 在一起，标在后面那个：guì、liù。"}] },
   { h:"拼读与变调", en:"Spelling rules & tone sandhi",
     p:[["你好","nǐ hǎo → ní hǎo","Two 3rd tones: the first becomes 2nd tone"],["不是","bù + shì → bú shì","不 before a 4th tone becomes 2nd tone"],["去、女、绿","qù · nǚ · lǜ","j, q, x + ü drop the two dots: ju, qu, xu"]],
     tips:[{r:"j、q、x 后面的 u 其实是 ü：ju = jü，qu = qü，xu = xü。"},{r:"n、l 后面要保留两点：nǚ（女）、lǜ（绿）。"}] },

  if(!hasTTS){ toast("这个浏览器不支持朗读，请看拼音。"); return; }

function mesh(geo, color, x=0,y=0,z=0, opts){ const m=new THREE.Mesh(geo, typeof color==="number"?M(color,opts):color); m.position.set(x,y,z); m.castShadow=true; m.receiveShadow=true; return m; }
const box = (w,h,d,c,x,y,z,o)=>mesh(new THREE.BoxGeometry(w,h,d),c,x,y,z,o);

function rng(seed){ return ()=>{ seed|=0; seed=seed+0x6D2B79F5|0; let t=Math.imul(seed^seed>>>15,1|seed); t=t+Math.imul(t^t>>>7,61|t)^t; return ((t^t>>>14)>>>0)/4294967296; }; }
function wobble(geo, s1, s2){ const p=geo.attributes.position; for(let i=0;i<p.count;i++){ const x=p.getX(i), z=p.getZ(i), a=Math.atan2(z,x); const f=1+.09*Math.sin(3*a+s1)+.05*Math.sin(7*a+s2); p.setX(i,x*f); p.setZ(i,z*f);} geo.computeVertexNormals(); return geo; }

function palm(g, x, z, s, r){ const p=new THREE.Group(); p.position.set(x,0,z); const lean=(r()-.5)*.5;
  const tr=cyl(.18*s,.3*s,4.2*s,6,0x9a7046,0,2.1*s,0); tr.rotation.z=lean; p.add(tr);

function shophouse(color, w=2.6, d=3){ const g=new THREE.Group();

    for(let p=0;p<6;p++){ const a=p/6*Math.PI*2; x.beginPath(); x.ellipse(cx+Math.cos(a)*6,cy+Math.sin(a)*6,5,2.4,a,0,Math.PI*2); x.fill(); }

  g.add(mesh(wobble(new THREE.CylinderGeometry(r,r*1.06,1.4,22),i,i*2),new THREE.Color(d.grass).multiplyScalar(.78).getHex(),0,1.5,0));
  for(let k=0;k<5;k++){ const a=rr()*Math.PI*2; if(Math.abs(Math.sin(a)-1)<.5) continue; const x=Math.cos(a)*r*.84, z=Math.sin(a)*r*.84; const kind=k%3; if(kind===2) frangipani(g,x,z); else if(kind===1) banana(g,x,z,.85); else palm(g, x, z, .8+rr()*.35, rr); }
  const A=[]; const lm=LM[d.lm](A,r); lm.position.y=2.2; g.add(lm);
  // number post (gold flag pole with module colour)
  // clouds over locked islands
  const clouds=new THREE.Group(); const cm=new THREE.MeshStandardMaterial({color:0xffffff,roughness:1,flatShading:true,transparent:true,opacity:.96});
  for(let k=0;k<9;k++){ const a=k/9*Math.PI*2+rr(); const s=3+rr()*2.8; const c=new THREE.Mesh(new THREE.IcosahedronGeometry(s,1),cm); c.position.set(Math.cos(a)*r*.55,8+rr()*4,Math.sin(a)*r*.55); clouds.add(c); }
  { const top=new THREE.Mesh(new THREE.IcosahedronGeometry(6,1),cm); top.position.set(0,11,0); clouds.add(top); }
  g.add(clouds);
  scene.add(g);
  const k0=isUnlocked(i)?0:1; clouds.scale.setScalar(k0||.001); clouds.visible=!!k0;
  isles[i]={group:g, clouds, cloudK:k0, anim:A, r};
}

function buildRoute(){
  const pts=ISLANDS.map(d=>new THREE.Vector3(d.pos[0],.4,d.pos[1]));
  const curve=new THREE.CatmullRomCurve3(pts,false,"catmullrom",.4);
  const N=150, geo=new THREE.SphereGeometry(.42,6,4);
  routeDots=[];
  for(let k=0;k<=N;k++){ const u=k/N, p=curve.getPointAt(u);
    // skip dots inside islands
    if(ISLANDS.some(d=>Math.hypot(p.x-d.pos[0],p.z-d.pos[1])<(d.r||10.5)*1.3)) continue;
    const seg=Math.min(ISLANDS.length-2, Math.floor(u*(ISLANDS.length-1)));
    const m=new THREE.Mesh(geo, new THREE.MeshStandardMaterial({color:0xffffff,roughness:.6})); m.position.copy(p); scene.add(m); routeDots.push({m,seg}); }
}
function refreshRoute(){ routeDots.forEach(({m,seg})=>{ m.material.color.setHex(starsOf(seg)>=1||state.teacher ? 0xf2c14e : 0xffffff); m.material.emissive=new THREE.Color(starsOf(seg)>=1?0x7a5200:0x000000); }); }

function readTheme(){ const cs=getComputedStyle(document.documentElement); return {sky:cs.getPropertyValue("--sky").trim()||"#bfe2ec", fog:cs.getPropertyValue("--fog").trim()||"#cfe8ef", sea:cs.getPropertyValue("--sea").trim()||"#2a8ea6"}; }
function applyTheme(){ if(!scene) return; const t=readTheme(); scene.background=new THREE.Color(t.sky); scene.fog=new THREE.Fog(t.fog,170,460); ocean.material.color.set(t.sea);
  const dark=document.documentElement.dataset.theme==="dark"||(document.documentElement.dataset.theme!=="light"&&matchMedia("(prefers-color-scheme: dark)").matches);
  hemi.intensity=dark?.45:.8; sun.intensity=dark?.55:.95; sun.color.set(dark?0xc9d6ff:0xfff1dc); }

function initScene(){
  const canvas=$("#scene");
  renderer=new THREE.WebGLRenderer({canvas, antialias:true});
  renderer.setPixelRatio(Math.min(window.devicePixelRatio||1,2));
  renderer.shadowMap.enabled=true; renderer.shadowMap.type=THREE.PCFSoftShadowMap;
  scene=new THREE.Scene();
  camera=new THREE.PerspectiveCamera(42,1,.5,1000);
  controls=new THREE.OrbitControls(camera, canvas);
  controls.enableDamping=true; controls.dampingFactor=.08; controls.maxPolarAngle=1.32; controls.minDistance=14; controls.maxDistance=300; controls.screenSpacePanning=false;
  hemi=new THREE.HemisphereLight(0xffffff,0x6f8f5c,.8); scene.add(hemi);
  sun=new THREE.DirectionalLight(0xfff1dc,.95); sun.position.set(-70,110,60); sun.castShadow=true; sun.shadow.mapSize.set(2048,2048);
  Object.assign(sun.shadow.camera,{left:-120,right:120,top:120,bottom:-120,near:10,far:320}); sun.shadow.bias=-.0008; scene.add(sun);
  const og=new THREE.PlaneGeometry(800,800,96,96); og.rotateX(-Math.PI/2);
  ocean=new THREE.Mesh(og,new THREE.MeshStandardMaterial({color:0x2a8ea6,roughness:.55,metalness:.05,flatShading:true})); ocean.receiveShadow=true; scene.add(ocean);
  oceanBase=Float32Array.from(og.attributes.position.array);
  ISLANDS.forEach(buildIsland); buildRoute(); refreshRoute(); applyTheme();
  [[-12,30,6,.16,NY.lantern,C.gold],[20,-2,5,-.2,C.gold,NY.shutter],[-28,-12,5,.18,NY.shutter,NY.lantern]].forEach(([cx,cz,R,sp,a,b])=>{ const bt=perahu(a,b); bt.scale.setScalar(1.1); scene.add(bt);
    seaBoats.push(t=>{ const ang=t*sp; bt.position.set(cx+Math.cos(ang)*R,.2+Math.sin(t*1.5+cx)*.15,cz+Math.sin(ang)*R); bt.rotation.y=-ang+(sp>0?Math.PI:0); bt.rotation.z=Math.sin(t*1.2+cz)*.06; }); });
  matchMedia("(prefers-color-scheme: dark)").addEventListener?.("change",applyTheme);
  new MutationObserver(applyTheme).observe(document.documentElement,{attributes:true,attributeFilter:["data-theme"]});
  resize(); setOverview(true);
  // picking
  const ray=new THREE.Raycaster(), ndc=new THREE.Vector2(); let down=null;
  canvas.addEventListener("pointerdown",e=>{ down=[e.clientX,e.clientY]; if(fly){ fly=null; controls.enabled=true; } });
  canvas.addEventListener("pointerup",e=>{ if(!down) return; const dx=e.clientX-down[0], dy=e.clientY-down[1]; down=null; if(dx*dx+dy*dy>49) return;
    const rc=canvas.getBoundingClientRect(); ndc.set((e.clientX-rc.left)/rc.width*2-1, -(e.clientY-rc.top)/rc.height*2+1); ray.setFromCamera(ndc,camera);
    const hit=ray.intersectObjects(isles.map(o=>o.group),true)[0]; if(!hit) return; let o=hit.object; while(o && o.userData.idx===undefined) o=o.parent; if(o) openIsland(o.userData.idx); });
  requestAnimationFrame(loop);
}

function aspect(){ return innerWidth/Math.max(1,innerHeight); }
function setOverview(instant){
  const a=aspect(), fov=camera.fov*Math.PI/180, hf=2*Math.atan(Math.tan(fov/2)*a);
  let dir, half;
  if(a<1){ dir=new THREE.Vector3(1,1.3,.2).normalize(); half=60; } else { dir=new THREE.Vector3(0,.9,1).normalize(); half=90; }
  const dist=Math.min(290, Math.max(half/Math.tan(hf/2), (a<1?66:44)/Math.tan(fov/2)));
  const tgt=new THREE.Vector3(CENTER.x,0,CENTER.z), pos=tgt.clone().add(dir.multiplyScalar(dist));
  go(pos,tgt,instant?0:1100);
}
function focusIsland(i){ const d=ISLANDS[i], a=aspect(); const tgt=new THREE.Vector3(d.pos[0],3.5,d.pos[1]); const f=a<.8?1.55:1; const pos=tgt.clone().add(new THREE.Vector3(12*f,22*f,30*f)); go(pos,tgt,1100); }
function go(pos,tgt,dur){ if(!dur){ camera.position.copy(pos); controls.target.copy(tgt); controls.update(); return; } fly={p0:camera.position.clone(),t0:controls.target.clone(),p1:pos,t1:tgt,s:performance.now(),dur}; controls.enabled=false; }
const ease = k => k<.5 ? 4*k*k*k : 1-Math.pow(-2*k+2,3)/2;

function resize(){ if(!renderer) return; const w=innerWidth, h=innerHeight; renderer.setSize(w,h,false); camera.aspect=w/h; camera.updateProjectionMatrix(); applyOffset(); }
function applyOffset(){ const w=innerWidth, h=innerHeight; if(Math.abs(viewOff.x)<.5 && Math.abs(viewOff.y)<.5){ camera.clearViewOffset(); } else camera.setViewOffset(w,h,viewOff.x,viewOff.y,w,h); }
function updateOffsetGoal(){ const p=$("#panel"), s=$("#side"); const el=!p.hidden?p:(!s.hidden?s:null); if(!el){ viewOffGoal={x:0,y:0}; return; }
  if(innerWidth<=720) viewOffGoal={x:0,y:el.offsetHeight/2}; else viewOffGoal={x:(el.offsetWidth+16)/2,y:0}; }

function loop(now){
  requestAnimationFrame(loop);
  if(document.hidden) return;
  const dt=Math.min(.05,(now-lastNow)/1000); lastNow=now; if(animOn) simT+=dt;
  if(fly){ const k=Math.min(1,(now-fly.s)/fly.dur), e=ease(k); camera.position.lerpVectors(fly.p0,fly.p1,e); controls.target.lerpVectors(fly.t0,fly.t1,e); if(k>=1){ fly=null; controls.enabled=true; } }
  // view offset easing
  viewOff.x+=(viewOffGoal.x-viewOff.x)*Math.min(1,dt*7); viewOff.y+=(viewOffGoal.y-viewOff.y)*Math.min(1,dt*7); applyOffset();
  controls.update();
  if(animOn){ const p=ocean.geometry.attributes.position, b=oceanBase, t=simT; for(let i=0;i<p.count;i++){ const x=b[i*3], z=b[i*3+2]; p.array[i*3+1]=Math.sin(x*.07+t*.9)*.38+Math.cos(z*.06+t*.7)*.32; } p.needsUpdate=true; }
  seaBoats.forEach(f=>f(simT));
  isles.forEach((o,i)=>{ o.anim.forEach(f=>f(simT)); const goal=isUnlocked(i)?0:1; if(Math.abs(o.cloudK-goal)>.001){ o.cloudK+=(goal-o.cloudK)*Math.min(1,dt*2.2); if(Math.abs(o.cloudK-goal)<.01) o.cloudK=goal; } o.clouds.visible=o.cloudK>.01; o.clouds.scale.setScalar(Math.max(.001,o.cloudK)); o.clouds.rotation.y=simT*.05; });
  renderer.render(scene,camera);
  placeLabels();
}

function buildLabels(){ ISLANDS.forEach((d,i)=>{ const b=document.createElement("button"); b.type="button"; b.className="lbl"; b.addEventListener("click",()=>openIsland(i)); labelsEl.appendChild(b); lbls.push(b); }); refreshLabels(); }
function refreshLabels(){ ISLANDS.forEach((d,i)=>{ const un=isUnlocked(i), b=lbls[i]; if(!b) return; b.classList.toggle("locked",!un);

function placeLabels(){ const w=innerWidth,h=innerHeight; ISLANDS.forEach((d,i)=>{ const b=lbls[i]; pv.set(d.pos[0], isUnlocked(i)?17:19, d.pos[1]).project(camera);
  if(i===cur||pv.z>1||pv.x<-1.2||pv.x>1.2||pv.y<-1.2||pv.y>1.2){ b.style.display="none"; return; } b.style.display=""; b.style.transform=`translate(${(pv.x*.5+.5)*w}px,${(-pv.y*.5+.5)*h}px) translate(-50%,-100%)`; }); }

  side.hidden=true; cur=i; tab="explore"; quiz=null; renderPanel(); panel.hidden=false; panel.querySelector(".d-body").scrollTop=0;

/* ---------- quiz ---------- */
function buildQuiz(i){
  const d=ISLANDS[i];
  let qs;
  if(d.mixed){ const pool=ISLANDS.slice(0,8).flatMap(x=>x.quiz.map(q=>Object.assign({from:x.no},q))); qs=shuffle(d.quiz).concat(shuffle(pool).slice(0,7)); qs=shuffle(qs); }
  else qs=shuffle(d.quiz).slice(0,5);
  return {i, qs:qs.map(q=>Object.assign({}, q, {opts:shuffle([q.a].concat(q.d))})), k:-1, score:0, res:[], picked:null};
}
function renderQuiz(body){
  const d=ISLANDS[cur];
  if(!quiz || quiz.i!==cur){ const n=d.mixed?10:5, need=Math.ceil(n*.6);
    body.innerHTML=`<div class="start"><h3>${d.name} · 闯关挑战</h3>
      <ul><li>共 ${n} 题，题目和选项顺序每次都会打乱。</li><li>答对 ${need} 题得 1 颗星${cur<8?`，并解锁下一座岛 ${ISLANDS[cur+1].no}「${ISLANDS[cur+1].name}」`:""}。</li><li>答对 ${Math.ceil(n*.8)} 题得 2 颗星，全对得 3 颗星。</li>${d.mixed?"<li>终点舞台的题目来自全学期九个岛。</li>":""}<li>带“听一听”的题目请打开声音。</li></ul>
      <p style="margin:0;color:var(--muted);font-size:13px">最佳成绩：${stars3(starsOf(cur))}</p>
      <button class="btn" type="button" id="qGo">开始闯关</button></div>`;
    $("#qGo").onclick=()=>{ quiz=buildQuiz(cur); quiz.k=0; renderQuiz(body); speakIfListen(); };
    return; }
  if(quiz.k>=quiz.qs.length) return renderResult(body);
  const q=quiz.qs[quiz.k], n=quiz.qs.length;
  body.innerHTML=`
    <div class="q-top"><span>第 ${quiz.k+1} / ${n} 题${q.from?` · 来自 ${q.from}`:""}</span><span class="dots">${quiz.qs.map((_,j)=>`<i class="${j<quiz.k?(quiz.res[j]?"ok":"no"):(j===quiz.k?"cur":"")}"></i>`).join("")}</span></div>
    <p class="q-text">${esc(q.q)}</p>
    ${q.au?`<button class="play" type="button" id="qPlay"><svg viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg>播放 Play</button>${hasTTS?"":`<span class="apy">（此设备不能朗读，拼音：${esc(q.apy)}）</span>`}`:""}
    <div class="opts">${q.opts.map((o,j)=>`<button class="opt" type="button" data-j="${j}"><span class="k">${"ABCD"[j]}</span><span>${esc(o)}</span></button>`).join("")}</div>
    <div id="qAfter"></div>`;
  if(q.au) $("#qPlay").onclick=()=>speak(q.au);
  body.querySelectorAll(".opt").forEach(b=>b.addEventListener("click",()=>answer(+b.dataset.j, body)));
}
function speakIfListen(){ const q=quiz&&quiz.qs[quiz.k]; if(q&&q.au) speak(q.au); }
function answer(j, body){
  const q=quiz.qs[quiz.k]; if(quiz.res.length>quiz.k) return;
  const ok=q.opts[j]===q.a; quiz.res.push(ok); if(ok) quiz.score++;
  body.querySelectorAll(".opt").forEach((b,k)=>{ b.disabled=true; if(q.opts[k]===q.a) b.classList.add("ok"); else if(k===j) b.classList.add("no"); });
  const last=quiz.k===quiz.qs.length-1;
  $("#qAfter").innerHTML=`<div class="explain"><b style="color:${ok?"var(--ok)":"var(--bad)"}">${ok?"答对了！":"再想想："}</b> 正确答案是「${esc(q.a)}」。${q.x?esc(q.x):""}${q.au?` <span class="apy">（${esc(q.au)} · ${esc(q.apy)}）</span>`:""}</div>
    <div class="row" style="margin-top:12px"><button class="btn" type="button" id="qNext">${last?"看成绩":"下一题"}</button></div>`;
  const dots=body.querySelectorAll(".dots i"); dots[quiz.k].className=ok?"ok":"no";
  $("#qNext").onclick=()=>{ quiz.k++; renderQuiz(body); speakIfListen(); };
  $("#qNext").focus();
}
function renderResult(body){
  const n=quiz.qs.length, sc=quiz.score, r=sc/n, st=r>=1?3:r>=.8?2:r>=.6?1:0;
  const prev=starsOf(cur), wasLocked=cur<8 && !isUnlocked(cur+1);

  const newly = wasLocked && isUnlocked(cur+1);
  refreshLabels(); $("#tQuiz").innerHTML=`闯关 <span class="lbl-stars" style="display:flex">${stars3(starsOf(cur))}</span>`;
  const msg = st===3?"满分！太棒了！": st===2?"很好！差一点就满分。": st===1?"过关了！再练练可以拿更多星。":"还差一点，回到「探索」复习一下再来。";
  body.innerHTML=`<div class="result">
    <div class="stars">${stars3(st)}</div>
    <div class="big">${sc} / ${n}</div>
    <p style="margin:0">${msg}</p>
    ${st>prev&&prev>0?`<p style="margin:0;color:var(--muted)">刷新最佳成绩：${prev} → ${st} 颗星</p>`:""}
    ${newly?`<p class="unlock" style="margin:0">云雾散开了！新岛屿已解锁：${ISLANDS[cur+1].no}「${ISLANDS[cur+1].name}」</p>`:""}
    ${cur===8&&st>0?`<p class="unlock" style="margin:0">恭喜你走完整个学期的知识群岛！</p>`:""}
    <div class="row" style="justify-content:center;margin-top:8px">
      <button class="btn ghost" type="button" id="rAgain">再挑战一次</button>
      ${cur<8&&isUnlocked(cur+1)?`<button class="btn" type="button" id="rNext">前往 ${ISLANDS[cur+1].name}</button>`:`<button class="btn" type="button" id="rExp">回到探索</button>`}
    </div></div>`;
  $("#rAgain").onclick=()=>{ quiz=buildQuiz(cur); quiz.k=0; renderQuiz(body); speakIfListen(); };
  const nx=$("#rNext"); if(nx) nx.onclick=()=>openIsland(cur+1);
  const ex=$("#rExp"); if(ex) ex.onclick=()=>{ tab="explore"; quiz=null; renderPanel(); };
}

    side.querySelectorAll(".li").forEach(b=>b.onclick=()=>openIsland(+b.dataset.i));
  } else {
    side.innerHTML=`<div class="d-head"><button class="d-close" type="button" id="sClose" aria-label="关闭">${X_SVG}</button><div class="chip">设置</div><h2 class="d-title">设置</h2><p class="d-sub">进度只保存在这台设备的浏览器里。</p></div>
      <div class="d-body"><div class="set">
        <button class="switch" type="button" role="switch" id="swT" aria-checked="${state.teacher}"><span><b>教师模式：解锁全部岛屿</b><small>上课演示用。学生的星星不会改变。</small></span><span class="tr"></span></button>
        <button class="switch" type="button" role="switch" id="swM" aria-checked="${animOn}"><span><b>动态效果</b><small>海浪、灯塔、巴士等动画。</small></span><span class="tr"></span></button>
        <div class="row"><button class="btn ghost" type="button" id="rst">重置全部进度</button></div>
        <p style="margin:0;color:var(--muted);font-size:12.5px">内容来源：LEM-1401 / LM-1403 全学期教学大纲、Week 7 与 Week 8 Online Notes。课本：《轻松学中文 1》。</p>
      </div></div>`;
    $("#swT").onclick=e=>{ state.teacher=!state.teacher; save(); e.currentTarget.setAttribute("aria-checked",state.teacher); refreshLabels(); toast(state.teacher?"已解锁全部岛屿（教师模式）":"已关闭教师模式"); };
    $("#swM").onclick=e=>{ setAnim(!animOn); e.currentTarget.setAttribute("aria-checked",animOn); };
    let armed=false; $("#rst").onclick=e=>{ if(!armed){ armed=true; e.currentTarget.textContent="再点一次确认重置"; e.currentTarget.style.borderColor="var(--bad)"; e.currentTarget.style.color="var(--bad)"; return; } state={stars:{},teacher:false}; save(); refreshLabels(); openSide("settings"); toast("进度已重置"); };
  }
  $("#sClose").onclick=()=>{ side.hidden=true; updateOffsetGoal(); };
  side.hidden=false; updateOffsetGoal();
}
function setAnim(on){ animOn=on; const b=$("#bMotion"); b.setAttribute("aria-pressed",!on); b.querySelector("span").textContent=on?"暂停动态":"恢复动态"; b.querySelector("svg").innerHTML=on?'<path d="M10 5v14M14 5v14"/>':'<path d="M8 5v14l11-7z"/>'; }

$("#bList").onclick=()=>openSide("list");
$("#bSet").onclick=()=>openSide("settings");
$("#bHome").onclick=()=>{ closePanel(); side.hidden=true; updateOffsetGoal(); if(scene) setOverview(false); };
$("#bMotion").onclick=()=>setAnim(!animOn);
addEventListener("keydown",e=>{ if(e.key==="Escape"){ if(!panel.hidden) closePanel(); else if(!side.hidden){ side.hidden=true; updateOffsetGoal(); } } });
addEventListener("resize",()=>{ resize(); updateOffsetGoal(); });

/* ============================== boot ============================== */
setAnim(animOn);
if(HAS3D){ buildLabels(); initScene(); }
else { $("#hint").hidden=true; refreshLabels(); openSide("list"); }
</script>

</body>
</html>
